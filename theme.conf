# Terminal palette. ANSI colors follow the selected terminal theme.
set -g @is-light '#{==:#{client_theme},light}'
set -g @status-bg '#{?#{E:@is-light},colour7,colour0}'
set -g @status-fg '#{?#{E:@is-light},colour0,colour7}'
set -g @window-active-bg '#{?#{E:@is-light},colour0,colour7}'
set -g @window-active-fg '#{?#{E:@is-light},colour15,colour0}'
set -g @primary-colour colour3
set -g @battery-low colour1
set -g @battery-medium colour208
set -g @battery-high colour3
set -g @battery-full colour2
set -g @muted-colour colour8
set -g @contrast-colour colour0

# UI icons and separators.
set -g @icon-session ''
set -g @icon-prefix '󰠠'
set -g @icon-zoom '󰊓'
set -g @icon-battery '󰁹'
set -g @icon-battery-charging '󰂄'
set -g @icon-host '󰒋'
set -g @icon-terminal ''
set -g @info-separator '#[fg=#{E:@muted-colour},nobold]▕'
set -g @window-separator '#[fg=#{E:@muted-colour},nobold]▕'

# Generate native tmux lookups once per reload from the process table.
run-shell 'sh "#{d:current_file}/process-icons.sh"'

# Reusable styles. Restore the text color after each colored pane icon.
set -g @active-style 'fg=#{E:@window-active-fg},bg=#{E:@window-active-bg},bold'
set -g @session-style 'fg=#{E:@contrast-colour},bg=#{E:@primary-colour},bold'
set -g @host-style 'fg=#{E:@window-active-fg},bg=#{E:@window-active-bg},nobold'
set -g @pane-icon-active '#[fg=#{E:@pane-colour}]#{E:@pane-icon}#[fg=#{E:@window-active-fg}]'
set -g @window-icons '#{P:#{E:@pane-icon} }'
set -g @window-icons-active '#{P:#{E:@pane-icon-active} }'
set -g @window-label '#W'
set -g @window-zoom '#{?window_zoomed_flag, #{E:@icon-zoom},}'
set -g @session-icon '#{?client_prefix,#{E:@icon-prefix},#{E:@icon-session}}'

# Battery text color: red <10%, orange <25%, yellow <50%, green >=50%.
set -gF @battery-script '#{d:current_file}/battery.sh'
set -g @battery '#(sh "#{@battery-script}" "#{@icon-battery}" "#{@battery-low}" "#{@battery-medium}" "#{@battery-high}" "#{@battery-full}" "#{@icon-battery-charging}")'
set -g @host '#{E:@icon-host} #h'

# Single-row status, with one icon for every pane and manually editable names.
set -g status-position bottom
set -g status-left-length 24
set -g status-right-length 120
set -g window-status-separator ''
set -g status-style 'bg=#{E:@status-bg},fg=#{E:@status-fg}'
set -g status-left '#[#{E:@session-style}] #{E:@session-icon} #S#{E:@window-separator}'
set -g window-status-format '#[default] #I #{E:@window-icons}#{E:@window-label}#{E:@window-separator}'
set -g window-status-current-format '#[#{E:@active-style}] #I #{E:@window-icons-active}#{E:@window-label}#{E:@window-zoom}#{E:@window-separator}'
set -g status-right '#[fg=#{E:@window-active-fg},bg=#{E:@window-active-bg},nobold]#{E:@battery}#{E:@info-separator}#[#{E:@host-style}] #{E:@host} '

set -g pane-border-style 'fg=#{E:@muted-colour}'
set -g pane-active-border-style 'fg=#{E:@primary-colour}'
set -gF display-panes-colour '#{@muted-colour}'
set -gF display-panes-active-colour '#{@primary-colour}'
set -g message-style '#{E:@session-style}'
set -g mode-style 'fg=#{E:@contrast-colour},bg=#{E:@primary-colour}'
